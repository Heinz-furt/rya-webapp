<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body { font-family: -apple-system, system-ui, sans-serif; background: #17212b; color: #fff; margin: 0; padding: 16px; }
h1 { font-size: 22px; margin: 0 0 6px; }
.sub { opacity: .6; font-size: 13px; margin-bottom: 20px; }
.cmd { display: block; padding: 14px; margin-bottom: 8px; background: #232e3c; border-radius: 10px; color: inherit; text-decoration: none; font-size: 15px; }
.cmd:active { opacity: .7; }
</style>
</head>
<body>
<h1>🤖 RYA Bot</h1>
<div class="sub">Tap command untuk salin</div>
<a class="cmd" onclick="copy('/daily')">🎁 Daily</a>
<a class="cmd" onclick="copy('/profile')">📘 Profile</a>
<a class="cmd" onclick="copy('/work')">⛏️ Work</a>
<a class="cmd" onclick="copy('/job')">💼 Job</a>
<a class="cmd" onclick="copy('/gamble')">🎲 Gamble</a>
<a class="cmd" onclick="copy('/shop')">🛒 Shop</a>
<a class="cmd" onclick="copy('/pet')">🐾 Pet</a>
<a class="cmd" onclick="copy('/combat')">⚔️ Combat</a>
<a class="cmd" onclick="copy('/stats')">📊 Stats</a>
<a class="cmd" onclick="copy('/help')">📚 Help</a>
<script>
function copy(t) {
  navigator.clipboard.writeText(t).then(() => {
    Telegram?.WebApp ? Telegram.WebApp.showAlert('Copied: ' + t) : alert('Copied: ' + t);
  });
}
if (window.Telegram?.WebApp) { Telegram.WebApp.ready(); Telegram.WebApp.expand(); }
</script>
</body>
</html>
